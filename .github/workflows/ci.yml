name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Candidate review packets verify immutable historical Git objects.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated verification environment
        shell: pwsh
        run: |
          python -m venv .tmp/ci-venv
          if ($LASTEXITCODE -ne 0) { throw "Creating the verification environment failed." }
          $scriptsDirectory = if ($env:RUNNER_OS -eq 'Windows') { 'Scripts' } else { 'bin' }
          Join-Path (Resolve-Path .tmp/ci-venv).Path $scriptsDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install verified official paper SDK
        shell: pwsh
        run: |
          ./scripts/install-paper-sdk.ps1
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Installed Python dependencies are inconsistent." }

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install isolated verification browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run verification
        if: runner.os != 'Windows'
        run: make verify

      - name: Run Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify.ps1
