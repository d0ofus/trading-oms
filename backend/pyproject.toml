[project]
name = "trading-oms-backend"
version = "0.1.0"
description = "Minimal safety-first Trading OMS backend skeleton."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "uvicorn>=0.34,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
